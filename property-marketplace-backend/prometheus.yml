# prometheus.yml (Place this next to docker-compose.monitoring.yml)
global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
# Rule files (optional)
# rule_files:
#   - "first_rules.yml"
#   - "second_rules.yml"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] # Prometheus scrapes itself

  # Example: Scrape your NestJS backend (assuming it exposes metrics on /metrics)
  # Make sure your backend is accessible from within the Docker network.
  # If backend runs on host port 3000:
  - job_name: 'nestjs_backend'
    static_configs:
      # Use 'host.docker.internal' to access host machine from Docker containers
      # Ensure your NestJS app binds to 0.0.0.0, not just 127.0.0.1
      - targets: ['host.docker.internal:3000'] # Adjust port if needed
    metrics_path: /metrics
    scrape_interval: 10s

  # Example: Scrape Node Exporter (if used)
  # - job_name: 'node_exporter'
  #   static_configs:
  #     - targets: ['node_exporter:9100'] # Use service name if within compose

  # Example: Scrape Postgres Exporter (if used)
  # - job_name: 'postgres_exporter'
  #   static_configs:
  #     - targets: ['postgres_exporter:9187'] # Use service name if within compose